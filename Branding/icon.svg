    <path fill="url(#band)" d="
      M 995 545
      C 1020 510 1040 450 1045 395
      C 1080 500 1110 620 1122 700
      C 1130 780 1100 860 1040 930
      C 950 1030 800 1120 680 1130
      C 560 1140 420 1040 290 955
      C 360 975 460 960 513 935
      C 700 820 880 700 995 545 Z"/>
    <!-- top band: comes out of the fold at the top-left, runs to the right corner -->
    <path fill="url(#top)" d="
      M 350 180
      C 380 140 430 120 500 125
      C 650 135 850 190 960 250
      C 1020 290 1045 340 1045 395
      C 1040 450 1020 510 995 545
      C 850 460 600 370 365 360
      C 352 300 345 240 350 180 Z"/>
    <!-- left band, in front -->
    <path fill="url(#left)" d="
      M 365 360
      C 410 560 470 760 513 935
      C 460 960 360 975 290 955
      C 200 900 165 760 145 620
      C 125 500 135 455 175 400
      C 230 330 300 230 350 180
      C 345 240 352 300 365 360 Z"/>
