<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1254 1254">
  <!-- Mobius app icon source. Render: magick -background black icon.svg -resize 1024x1024 -alpha off ../Resources/AppIcon.png -->
  <defs>
    <linearGradient id="band" gradientUnits="userSpaceOnUse" x1="290" y1="0" x2="1125" y2="0">
      <stop offset="0" stop-color="#6e0000"/>
      <stop offset="0.18" stop-color="#b80000"/>
      <stop offset="0.5" stop-color="#ff2b2b"/>
      <stop offset="0.72" stop-color="#e00808"/>
      <stop offset="0.88" stop-color="#a00000"/>
      <stop offset="1" stop-color="#6a0000"/>
    </linearGradient>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="350" y1="0" x2="1045" y2="0">
      <stop offset="0" stop-color="#7a0000"/>
      <stop offset="0.1" stop-color="#a80000"/>
      <stop offset="0.3" stop-color="#ee1111"/>
      <stop offset="0.52" stop-color="#ff3a3a"/>
      <stop offset="0.78" stop-color="#f01515"/>
      <stop offset="1" stop-color="#c00000"/>
